<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060919" />
    <title>مركز الإشراق لرعاية وتأهيل ذوي الاحتياجات الخاصة</title>
    <!-- Google Cairo Arabic Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #060919;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      @keyframes shimmerBar {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .pre-splash-track {
        position: relative;
        overflow: hidden;
      }
      .pre-splash-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(90deg, transparent, #38BDF8, #F59E0B, transparent);
        animation: shimmerBar 1.2s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-[#060919] text-white font-sans selection:bg-brand-orange/20 select-none">
    <div id="app">
      <!-- Instant First-Frame Pre-Splash with Moving Bar (Zero White Screen) -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;background:linear-gradient(to bottom, #060919, #0D1333, #151D48);color:white;font-family:'Cairo',sans-serif;direction:rtl;z-index:9999;">
        <div style="width:100%;max-width:384px;display:flex;justify-content:space-between;padding-top:16px;">
          <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:9999px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);font-size:10px;font-weight:bold;color:#FDE68A;">
            <span>دار القوات الجوية</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;margin:auto 0;">
          <div style="width:120px;height:120px;border-radius:24px;background:rgba(255,255,255,0.95);padding:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);border:2px solid rgba(245,158,11,0.4);">
            <img src="/logo.png" alt="مركز الإشراق" style="width:100%;height:100%;object-fit:contain;" />
          </div>
          <div>
            <h1 style="font-size:24px;font-weight:900;margin:0 0 6px 0;color:white;">مركز الإشراق الطبي</h1>
            <p style="font-size:13px;font-weight:700;margin:0;color:#FDE68A;">لرعاية وتأهيل ذوي الاحتياجات الخاصة</p>
          </div>
        </div>
        <div style="width:100%;max-width:384px;padding-bottom:24px;">
          <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:#CBD5E1;margin-bottom:8px;">
            <span>جاري تهيئة منظومة إشراق...</span>
          </div>
          <div class="pre-splash-track" style="width:100%;height:8px;border-radius:9999px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);overflow:hidden;">
            <div class="pre-splash-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
