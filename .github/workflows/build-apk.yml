name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Al-Ishraq-Employees.apk
          echo "APK successfully built:"
          ls -lh output-apk/Al-Ishraq-Employees.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ishraq-Employees-APK
          path: output-apk/Al-Ishraq-Employees.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: "تطبيق مركز الإشراق الطبي - تحديث v1.0.${{ github.run_number }}"
          body: |
            ### 📱 تطبيق مركز الإشراق الطبي (الكوادر والأخصائيين)
            - **إصدار التجميع:** v1.0.${{ github.run_number }}
            - **المميزات المضمنة:**
              - شاشة انطلاق متحركة فاخرة (Cinematic Splash Screen).
              - المقاييس الإكلينيكية الأربعة (CARS-2, Portage, Vineland-3, Conners-3) بمعايير معتمدة 100%.
              - بصمة الحضور والانصراف والتحقق الجغرافي الذكي المعتمد.
              - حماية تامة ضد التزييف والتفويض.
            
            يمكنك تحميل ملف الـ APK وتثبيته مباشرة على هواتف أندرويد عبر الرابط أدناه.
          files: output-apk/Al-Ishraq-Employees.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
