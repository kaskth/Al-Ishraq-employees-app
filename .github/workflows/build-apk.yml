name: Build Android APK & OTA Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK & OTA Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_API_BASE_URL: https://api.aleshrakcentre.com/api/v1
        run: npm run build

      - name: Package OTA Update Bundle
        run: |
          mkdir -p output-ota
          cd dist
          zip -r ../output-ota/bundle-v1.0.${{ github.run_number }}.zip ./*
          cd ..
          cp output-ota/bundle-v1.0.${{ github.run_number }}.zip output-ota/bundle-latest.zip
          cat << EOF > output-ota/version.json
          {
            "version": "1.0.${{ github.run_number }}",
            "buildNumber": ${{ github.run_number }},
            "bundleUrl": "https://api.aleshrakcentre.com/uploads/updates/bundle-latest.zip",
            "notes": "تحديث هوائي تلقائي v1.0.${{ github.run_number }}"
          }
          EOF
          echo "OTA Bundle files:"
          ls -lh output-ota

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=35 --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Al-Ishraq-Employees.apk
          echo "APK successfully built:"
          ls -lh output-apk/Al-Ishraq-Employees.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ishraq-Employees-APK
          path: output-apk/Al-Ishraq-Employees.apk
          retention-days: 30

      - name: Upload OTA Bundle as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ishraq-OTA-Bundle
          path: output-ota/*
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: "تطبيق مركز الإشراق الطبي - تحديث v1.0.${{ github.run_number }}"
          body: |
            ### 📱 تطبيق مركز الإشراق الطبي (الكوادر والأخصائيين)
            - **إصدار التجميع:** v1.0.${{ github.run_number }}
            - **المميزات المضمنة:**
              - شاشة انطلاق متحركة فاخرة (Cinematic Splash Screen).
              - المقاييس الإكلينيكية الأربعة (CARS-2, Portage, Vineland-3, Conners-3) بمعايير معتمدة 100%.
              - بصمة الحضور والانصراف والتحقق الجغرافي الذكي المعتمد.
              - حماية تامة ضد التزييف والتفويض.
              - إصلاح مسارات وتحميل صور الأطفال والكوادر في الـ APK (الخادم الحي https://api.aleshrakcentre.com).
              - حزمة التحديث الهوائي الفوري التلقائي (OTA Bundle) بدون الحاجة لإعادة تثبيت التطبيق مستقبلاً.
            
            يمكنك تحميل ملف الـ APK وتثبيته مباشرة على هواتف أندرويد عبر الرابط أدناه.
          files: |
            output-apk/Al-Ishraq-Employees.apk
            output-ota/bundle-v1.0.${{ github.run_number }}.zip
            output-ota/bundle-latest.zip
            output-ota/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
